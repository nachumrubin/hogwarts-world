name: Deploy Creature Lab to GitHub Pages

on:
  push:
    branches: [creature-lab]
    paths:
      - 'creature-lab/**'
      - '.github/workflows/deploy-creature-lab.yml'
      - 'tools/build-creature-lab.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creature-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout creature-lab branch
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node tools/build-creature-lab.mjs --pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Creature Lab site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/creature-lab-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
