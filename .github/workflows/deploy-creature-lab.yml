name: Deploy Creature Lab to GitHub Pages

on:
  push:
    branches: [creature-lab]
    paths:
      - 'creature-lab/**'
      - '.github/workflows/deploy-creature-lab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creature-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout creature-lab branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Creature Lab site
        uses: actions/upload-pages-artifact@v3
        with:
          path: creature-lab
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
