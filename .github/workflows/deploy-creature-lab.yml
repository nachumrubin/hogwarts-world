name: Deploy Creature Lab to GitHub Pages

on:
  push:
    branches: [creature-lab]
    paths:
      - 'creature-lab/**'
      - '.github/workflows/deploy-creature-lab.yml'
      - 'tools/build-creature-lab.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creature-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout creature-lab branch
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node tools/build-creature-lab.mjs --pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Creature Lab site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/creature-lab-pages
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for delay in 1 2 4 8 16; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[].id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep "$delay"
          done
          echo "::error::Pages artifact is not indexed yet"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
